name: Backend Health Check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the check compares each function's last change with its deployment
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run backend health check
        env:
          # Lists deployed functions and secret NAMES (never values), and reads the database and file
          # storage size (D2). Without it those parts are skipped.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Plan limits in MB (defaults: the free plan, 500 and 1024). The check fails at 80%.
          USAGE_DB_LIMIT_MB: ${{ vars.USAGE_DB_LIMIT_MB }}
          USAGE_STORAGE_LIMIT_MB: ${{ vars.USAGE_STORAGE_LIMIT_MB }}
        run: node supabase/check-backend.js

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Backend health check"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
