name: Market Price Index

on:
  schedule:
    - cron: "30 18 * * *"   # 02:30 Philippine time (PST/PHT UTC+8)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# This job pushes straight to the branch it checks out, so two overlapping runs
# would race on the same ref and one would fail on a non-fast-forward. The daily
# schedule plus manual dispatch makes that easy to trigger by accident.
concurrency:
  group: market-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build daily index snapshot
        env:
          # Repository variable, not a hardcoded literal, so a host change is a
          # settings edit rather than a code edit. Set it under
          # Settings -> Secrets and variables -> Actions -> Variables.
          # The previous value was https://esrealty-market-scan.vercel.app
          MS_API_URL: ${{ vars.MS_API_URL }}
        run: |
          # Fall back to the public scan API the website itself uses
          # (js/supabase-config.js ESREALTY_MARKET_SCAN_BASE). The variable was
          # unset and this step failed every night from early October 2026,
          # leaving the index frozen at 2026-10-03.
          if [ -z "$MS_API_URL" ]; then
            echo "::warning::MS_API_URL repository variable is not set; using https://esrealty-market-scan.vercel.app"
            export MS_API_URL="https://esrealty-market-scan.vercel.app"
          fi
          node market-scan/build-index.js

      - name: Commit snapshot
        run: |
          git config user.name "SEA ESTATES Index Bot"
          git config user.email "index@esrealty.local"
          git add data/market-index.json
          if git diff --cached --quiet; then
            echo "No change in data/market-index.json; nothing to commit."
            exit 0
          fi
          git commit -m "Market Price Index snapshot $(date -u +%F)"
          git push

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Market price index"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
