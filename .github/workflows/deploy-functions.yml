name: Deploy edge functions

# Run by hand: Actions -> Deploy edge functions -> Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token: Supabase -> Account -> Access Tokens).

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy, separated by spaces"
        required: true
        default: "listing-api location-report seo"

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mrngaqtbaseewzcsogqi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the functions' shared copies are current
        run: node tests/edge_shared_sync_node.js
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Deploy
        env:
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret first (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          for fn in $FUNCTIONS; do
            # Public functions check their own secrets or roles, so the gateway
            # must not demand a login. notify-dispatch keeps the login check.
            case "$fn" in
              listing-api|location-report|seo|fb-leads|agent-dispatch|admin-create-account) flag="--no-verify-jwt" ;;
              notify-dispatch) flag="" ;;
              *) echo "::error::Unknown function: $fn"; exit 1 ;;
            esac
            echo "Deploying $fn $flag"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api $flag
          done
      - name: Health check
        run: node supabase/check-backend.js || true
