# Gate: the list above was hand-maintained, which is how 35 suites came
      # to be skipped without anyone noticing. Assert coverage so a new suite
      # cannot be added without a decision about CI.
      - name: Assert every *_e2e.js suite has CI coverage
        run: |
          set -uo pipefail
          missing=0
          for f in tests/*_e2e.js; do
            name=$(basename "$f" .js)
            # A suite counts as covered if this workflow names it, OR if a sweep
            # script drives it. The sweep scripts build the -Test argument at
            # runtime from a filename, so they are matched on the bare name rather
            # than on a literal "-Test <name>" that never appears in their source.
            # The workflow FILE: $GITHUB_WORKFLOW is the workflow NAME ("tests").
            if grep -qF -- "$name" .github/workflows/tests.yml \
               || grep -qF -- "$name" tests/run_all.ps1 tests/run_overflow_sweep.ps1 tests/run_mobile_nav_sweep.ps1; then
              continue
            fi
            echo "::error::$name has no CI step and no sweep entry. Add one, or record why it is excluded."
            missing=1
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all e2e suites have CI coverage"
