name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Every ping used to end in `|| true`, which made this job green even when
      # all three endpoints were dead. It could never alert on the thing it
      # exists to watch. The failure is now recorded and the step fails if any
      # endpoint stops answering, so the scheduled run actually turns red.
      - name: Ping endpoints (keeps the free Supabase project active)
        env:
          # Supabase project ref, previously repeated in four unrelated files
          # (this workflow, robots.txt, js/supabase-config.js and an index.html
          # preconnect). Keep the literal here, but name it once so a project
          # migration is a single edit in this file.
          SUPABASE_REF: hdkmvwxgjgzbuycjrbyq
          # Public host of the Market Scan micro-backend. Not a secret.
          MARKET_SCAN_URL: https://esrealty-market-scan.vercel.app
        run: |
          set -uo pipefail
          failed=0

          check() {
            local label="$1" url="$2"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url" 2>/dev/null) || code="000"
            printf '%-22s %s\n' "$label" "$code"
            case "$code" in
              2*|3*) ;;
              *) failed=1 ;;
            esac
          }

          check "listing-api/settings" "https://${SUPABASE_REF}.supabase.co/functions/v1/listing-api/api/site-settings"
          check "listing-api/listings"  "https://${SUPABASE_REF}.supabase.co/functions/v1/listing-api/api/listings?limit=1"
          check "vercel-market-scan"   "${MARKET_SCAN_URL}/api/ping"

          if [ "$failed" -ne 0 ]; then
            echo "One or more endpoints are unhealthy. A free-tier project that goes" >&2
            echo "fully idle can be paused, which is what this job exists to prevent." >&2
            exit 1
          fi
          echo "All endpoints healthy."

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Supabase keep-alive"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
