name: Old data clean-up - monthly

# First of each month: counts old data that the privacy periods say can go (read notifications
# after 180 days, resolved password resets after 30, spam inquiries after 90, Autopilot steps after
# 180). It deletes nothing until the repository variable RETENTION_CLEANUP is set to "on". Confirm
# the periods (in supabase/migrations/0010_handover_retention.sql) with your privacy officer or
# lawyer first. Leads, deals, money records, consent records and the change log are never touched.
# The log shows counts only. Needs migration 0010.

on:
  schedule:
    - cron: "41 19 1 * *"   # 03:41 Philippine time on the 2nd (19:41 UTC on the 1st)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hdkmvwxgjgzbuycjrbyq
      CLEANUP: ${{ vars.RETENTION_CLEANUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Clean up
        run: |
          if [ "$CLEANUP" = "on" ]; then node tools/retention_cleanup.js --delete; else node tools/retention_cleanup.js; fi

      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Old data clean-up"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
