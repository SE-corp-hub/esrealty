name: Phone alerts

# Every 10 minutes: new notifications (leads, assignments, rent reminders,
# tenant requests) go to the phones that turned alerts on. Off until the
# repository variable PUSH_ALERTS is "on" (runs are skipped until then) and the
# VAPID_PRIVATE_KEY secret is set; Settings > Phone alerts in the app shows how.
# The log shows counts only (this repository is public).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: push-alerts
  cancel-in-progress: false

jobs:
  push:
    if: vars.PUSH_ALERTS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PROJECT_REF: mrngaqtbaseewzcsogqi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the push library
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Send
        run: node tools/send_push.js

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Phone alerts"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then echo "Issue #$num is already open."; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
