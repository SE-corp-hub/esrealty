name: Reminders - viewings and licences

# Every 15 minutes:
#  - viewings and other calendar entries on a lead: the reminder picked on the entry (1 hour,
#    3 hours or 1 day before) goes to the bell of the person the lead is assigned to, and to their
#    phone if phone alerts are on;
#  - licences and permits in Compliance: 60, 30 and 7 days before they expire, and on the day,
#    the account that saved the record (and an agent's broker) is told.
# Sending is OFF until the repository variable REMINDER_ALERTS is set to "on"
# (Settings -> Secrets and variables -> Actions -> Variables). Until then each run only works it
# out and logs counts. The log never shows names or people (this repository is public).
#
# Needs migration 0011. Before it is applied the run says so in its log and stops without an alarm.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, so a "1 hour before" reminder is at most 15 minutes late
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mrngaqtbaseewzcsogqi
      SENDING: ${{ vars.REMINDER_ALERTS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Sweep
        run: |
          if [ "$SENDING" = "on" ]; then node tools/reminders.js --send; else node tools/reminders.js; fi

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Reminders"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
