name: SE Corp Hub - nightly totals

# Every night: ES Realty's commission from closed deals, what it pays out to agents and referrers,
# and new inquiries, for each of the last 30 Philippine days, go to the SE Corp Hub
# (tools/hub_feed.js). Re-sending a day replaces it there.
# Off until these are set (Settings -> Secrets and variables -> Actions):
#   variable HUB_FEED_URL      the hub's feed address, ending in /api/feed/daily-totals
#   variable HUB_BROKER_EMAIL  the login email of ES Realty's broker account
#   secret   HUB_FEED_TOKEN    the same value as FEED_TOKEN_ESREALTY on the hub
# The log never shows amounts or names (this repository is public).

on:
  schedule:
    - cron: "40 16 * * *"   # 00:40 Philippine time
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: hub-feed
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hdkmvwxgjgzbuycjrbyq
      HUB_FEED_URL: ${{ vars.HUB_FEED_URL }}
      HUB_BROKER_EMAIL: ${{ vars.HUB_BROKER_EMAIL }}
      HUB_FEED_TOKEN: ${{ secrets.HUB_FEED_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Send totals
        run: node tools/hub_feed.js

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: SE Corp Hub totals"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
