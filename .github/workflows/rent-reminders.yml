name: Rent reminders - daily

# Every morning: tenants get a notification in the app (the bell) 3 days
# before rent or a charge is due, on the day, the day after, then weekly while
# it is unpaid; managers get one summary. Sending is OFF until the repository
# variable RENT_REMINDERS is set to "on" (Settings -> Secrets and variables ->
# Actions -> Variables). Until then each run only works it out and logs counts.
# The log never shows names or amounts (this repository is public).

on:
  schedule:
    - cron: "7 0 * * *"   # 08:07 Philippine time
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: rent-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hdkmvwxgjgzbuycjrbyq
      SENDING: ${{ vars.RENT_REMINDERS }}
      TZ: Asia/Manila
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Remind
        run: |
          if [ "$SENDING" = "on" ]; then node tools/rent_reminders.js --send; else node tools/rent_reminders.js; fi

      # A failed scheduled run used to be seen only by whoever opened the Actions tab.
      # This opens one issue (found again by its title) so the failure reaches the owner.
      - name: Open an issue when this run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled job failed: Rent reminders"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Failed again. Run: $RUN_URL"; exit 0; fi
          gh issue create --title "$title" --body "A scheduled run failed. Run log: $RUN_URL

          Close this issue once it is fixed; the next failure opens a new one."
